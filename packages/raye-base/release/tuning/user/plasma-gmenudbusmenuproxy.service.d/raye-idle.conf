# The menu proxy only feeds a global menu (the "Global Menu" widget or the
# application menu button of a title bar), and Raye has neither. It starts
# only when one is in use, and once X11 runs (Xwayland-session.d).
[Service]
ExecStart=
ExecStart=/usr/libexec/raye-start-if-needed gmenudbusmenuproxy
