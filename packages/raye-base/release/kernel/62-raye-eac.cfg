# Easy Anti-Cheat Linux v2 asks for these on the boot line, explicitly:
# lockdown in integrity mode, kexec off, IOMMU translating (no
# passthrough). grub-mkconfig sources this file, so it is read again at
# every kernel update.
#
# Only with Secure Boot on. Then the kernel is already locked down and the
# IOMMU already translates; this makes it explicit, and turns kexec off.
# Without Secure Boot EAC v2 refuses anyway, and lockdown would refuse
# every unsigned module (VirtualBox, a DKMS driver) and hibernation for
# nothing. raye-eac-status says what holds on this boot.
#
# RAYE_EAC_SB_VAR is for the tests only.
raye_eac_sb=${RAYE_EAC_SB_VAR:-/sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c}
# the variable is 4 bytes of attributes, then one byte: 1 when on
if [ -r "$raye_eac_sb" ] &&
    [ "$(od -An -tu1 -j4 -N1 "$raye_eac_sb" 2>/dev/null | tr -d ' ')" = 1 ]; then
    case " ${GRUB_CMDLINE_LINUX:-} " in
    *" lockdown="*) ;;
    *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }lockdown=integrity sysctl.kernel.kexec_load_disabled=1 iommu.passthrough=0" ;;
    esac
fi
unset raye_eac_sb
