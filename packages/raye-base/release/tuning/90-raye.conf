# Raye defaults. Ubuntu's own files (55-*.conf) set the rest, including
# vm.max_map_count for games.

# zram is fast: swap there sooner rather than drop file cache
vm.swappiness = 150
# no read-ahead from swap: in zram it only decompresses pages nobody asked for
vm.page-cluster = 0
# a game that does split locks gets a warning in the log, not slowed down
kernel.split_lock_mitigate = 0
# fair queueing: steadier uploads, especially on Wi-Fi (needed by bbr)
net.core.default_qdisc = fq
# BBR keeps throughput up on lossy links; the kernel loads tcp_bbr itself
net.ipv4.tcp_congestion_control = bbr
# errors stay out of the console: the Raye screen covers start and shutdown,
# and the base system's 55-console-messages.conf (4) would print them over it
# at the end of a shutdown. They are still in the journal and in dmesg.
kernel.printk = 3 4 1 3
