# The boot menu shows for 3 seconds, then Raye starts. Long enough to pick
# "Raye Linux (safe graphics)" (11_raye_safe_graphics) with the arrow keys
# when a graphics card leaves the screen black, without knowing to hold a
# key or to type a kernel option.
GRUB_DISTRIBUTOR="Raye Linux"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=5
GRUB_DISABLE_OS_PROBER=false
# No kernel or system text on the screen while the computer starts, shuts
# down, restarts or installs updates: the Raye screen stays up. Esc on that
# screen still shows the details.
#   quiet splash           the Raye screen instead of the boot messages
#   loglevel=3             "quiet" alone still prints errors (a bad USB cable
#                          fills the screen with them at shutdown)
#   rd.udev.log_level=3    udev in the initramfs, then on the system, the same
#   udev.log_level=3
#   systemd.show_status=error   no "[ OK ]" or "A stop job is running" lines,
#                          only failures; plymouth keeps them for Esc, and
#                          without plymouth they print, so a start that goes
#                          wrong still says why ("false" hid those too)
#   vt.global_cursor_default=0  no blinking cursor behind the Raye screen
#   panic=30               after a kernel crash, the crash screen stays 30
#                          seconds, then the computer restarts on its own
#                          instead of freezing for good
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 udev.log_level=3 systemd.show_status=error vt.global_cursor_default=0 panic=30"
