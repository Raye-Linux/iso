; Raye Linux: GameMode while a game runs. The processor runs at full speed
; (the "performance" governor, GameMode's default, written out here),
; then raye-game-mode.service does the rest Settings > Gaming > Game Mode
; asks for (game scheduler, effects paused, best performance power mode);
; all of it goes back when the game ends. raye-game-watch hands Steam,
; Store and Windows games to GameMode. Nothing is reniced, and the screen
; does not lock during a game.
[general]
desiredgov=performance
renice=0
softrealtime=off
ioprio=0
inhibit_screensaver=1

[custom]
start=systemctl --user --no-block start raye-game-mode.service
end=systemctl --user --no-block stop raye-game-mode.service
script_timeout=10
