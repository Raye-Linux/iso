// A server that sends nothing for 15 s is left for the next mirror in
// /etc/apt/mirrors/*.list. apt's own wait is far longer: the day
// archive.ubuntu.com went quiet, "Checking for updates" took 6 minutes.
// A slow server that keeps sending is not cut off, only a silent one.
Acquire::http::Timeout "15";
Acquire::https::Timeout "15";
