# Raye Update installs its own offline updates. When /system-update points
# at them, PackageKit's installer must stay out: it finds nothing of its
# own, fails, and its FailureAction=reboot restarts the PC in the middle
# of the install. Skipped, not failed, so nothing reboots.
[Service]
ExecCondition=/bin/sh -c 'test "$(readlink /system-update)" != /var/lib/raye-update/offline'
