# Boot menu of the Raye Linux live image.
# Plain text menu: the graphical theme in boot/grub/themes made some
# firmware restart before the menu showed, so it stays off until it has
# been tried on real PCs.
set timeout=5
set default=0
set timeout_style=menu

# efi_gop, not all_video. Measured 2026-11-06 on the signed CD GRUB this
# ISO actually boots (EFI/BOOT/grubx64.efi, which build.sh:511 takes from the
# image): it carries 95 modules and all_video is NOT one of them, while
# efi_gop is. The disc ships no .mod file either, so `insmod all_video` had
# nothing to load from and failed on every real boot -- silently, because the
# test read this build machine's gcdx64.efi.signed, a different binary that
# does carry all_video. The image is UEFI-only (its El Torito catalog has one
# section, platform 0xEF), so efi_gop is the driver that matters.
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod gfxterm
    terminal_output gfxterm
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-magenta

menuentry "Install Raye Linux" {
    linux   /casper/vmlinuz boot=casper noprompt quiet splash ---
    initrd  /casper/initrd
}
menuentry "Installer Raye Linux" {
    linux   /casper/vmlinuz boot=casper noprompt locale=fr_CA.UTF-8 keyboard-layouts=ca quiet splash ---
    initrd  /casper/initrd
}
menuentry "Safe graphics" {
    linux   /casper/vmlinuz boot=casper noprompt nomodeset quiet splash ---
    initrd  /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI firmware settings" {
    fwsetup
}
fi
