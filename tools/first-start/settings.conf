# Raye Setup at the first start of a ready-made virtual machine: Raye is
# already on the disk, so only the questions of a new PC are left --
# language, region, keyboard, network, name of the PC, account, privacy.
# vm-images puts this file in /var/lib/raye-first-start/xdg/calamares, and
# the calamares wrapper of the first start points Calamares at it.
#
# The order of the show list is the steps list of the raye-first-start
# branding (strings.js), which vm-images writes from Raye Setup's own.
---
modules-search: [ /var/lib/raye-first-start/modules, /usr/lib/calamares/modules, local ]

instances:
- id: raye_network
  module: notesqml
  config: notesqml_raye_network.conf
- id: raye_device
  module: notesqml
  config: notesqml_raye_device.conf
- id: raye_account
  module: notesqml
  config: notesqml_raye_account.conf
- id: raye_privacy
  module: notesqml
  config: notesqml_raye_privacy.conf
- id: raye_first_start
  module: shellprocess
  config: shellprocess_raye_first_start.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - notesqml@raye_network
  - notesqml@raye_device
  - notesqml@raye_account
  - usersq
  - notesqml@raye_privacy
- exec:
  - rayefirststart
  - localeq
  - keyboardq
  - localecfg
  - usersq
  - rayesetupchoices
  - shellprocess@raye_first_start
- show:
  - finishedq

branding: raye-first-start
prompt-install: false
# everything runs on this system, there is no new one to step into
dont-chroot: true
oem-setup: true
disable-cancel: true
disable-cancel-during-exec: true
quit-at-end: false
