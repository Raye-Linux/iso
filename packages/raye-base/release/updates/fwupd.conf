# Read by fwupd after /etc/fwupd/fwupd.conf (its own conffile).
# fwupd stays in memory for good when its own start took longer than
# IdleInhibitStartupThreshold (500 ms), and a start of 2 to 3 s is common,
# so after the first update check it never left. With 0 it leaves once
# idle, and D-Bus starts it again for the next check.
[fwupd]
IdleInhibitStartupThreshold=0
