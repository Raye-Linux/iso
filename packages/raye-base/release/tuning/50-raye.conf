# Compressed swap in memory, as big as the RAM, at most 8 GiB. It only
# takes the memory of what is really swapped out, about a third of it once
# compressed, so a bigger cap lets more idle pages shrink instead of
# pushing out the file cache or the slow swap file.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
