; Raye Linux: GameMode while a game runs. Power mode and CPU governor are
; left to the user's choice, and nothing is reniced.
[general]
renice=0
ioprio=0
inhibit_screensaver=1

[custom]
start=systemctl --no-ask-password start raye-game-scheduler.service
end=systemctl --no-ask-password stop raye-game-scheduler.service
script_timeout=10
