// Before each update, /etc/apt/mirrors/ubuntu-nearby.list and
// ubuntu-security-nearby.list are written again: the mirror of the time
// zone's country first when it answers and is up to date, then the
// servers of /etc/apt/mirrors/ubuntu.list and ubuntu-security.list. A
// changed time zone is picked up here. It can never stop an update: when
// the script fails, or is gone, apt goes on with the lists it has.
// libapt runs this hook, so apt, unattended-upgrades and PackageKit
// (Raye Update) all get it.
APT::Update::Pre-Invoke {
    "if [ -x /usr/libexec/raye-ubuntu-mirrors ]; then timeout 20 /usr/libexec/raye-ubuntu-mirrors --refresh || true; fi";
};
