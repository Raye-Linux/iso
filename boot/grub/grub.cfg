# Boot menu of the Raye Linux live image.
# Plain text menu: the graphical theme in boot/grub/themes made some
# firmware restart before the menu showed, so it stays off until it has
# been tried on real PCs.
# Started from a USB stick, GRUB can take the small EFI partition for the
# image (it also carries .disk/info) and then finds no kernel: "you need to
# load the kernel first". Always point root at the disk that holds it.
search --no-floppy --set=root --file /casper/vmlinuz
# A stick written badly (or a download cut short) has no kernel to find:
# say so plainly instead of GRUB's "you need to load the kernel first".
if [ ! -f /casper/vmlinuz ]; then set raye_broken=1; fi
if [ ! -f /casper/initrd ]; then set raye_broken=1; fi
set timeout=5
set default=0
set timeout_style=menu

# efi_gop, not all_video. Measured 2026-11-06 on the signed CD GRUB this
# ISO actually boots (EFI/BOOT/grubx64.efi, which build.sh:511 takes from the
# image): it carries 95 modules and all_video is NOT one of them, while
# efi_gop is. The disc ships no .mod file either, so `insmod all_video` had
# nothing to load from and failed on every real boot -- silently, because the
# test read this build machine's gcdx64.efi.signed, a different binary that
# does carry all_video. On UEFI efi_gop is the driver that matters; the BIOS
# image (old PCs, built by build.sh) carries vbe instead.
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    # in BIOS mode (old PCs) vbe is built into the BIOS image already
    if [ "$grub_platform" = "efi" ]; then
        insmod efi_gop
    fi
    insmod gfxterm
    terminal_output gfxterm
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-magenta

if [ "$raye_broken" = 1 ]; then
set timeout=-1
menuentry "This USB stick was not written correctly" {
    echo "The stick was written badly, or the download is incomplete."
    echo "Download Raye Linux again from rayelinux.com, then write it with"
    echo "Rufus in DD Image mode (or balenaEtcher)."
    echo ""
    echo "The PC restarts in 60 seconds (Esc to restart now)."
    # read is not in the signed GRUB; sleep is
    sleep --interruptible 60
    reboot
}
else
menuentry "Install Raye Linux" {
    linux   /casper/vmlinuz boot=casper noprompt quiet splash ---
    initrd  /casper/initrd
}
menuentry "Installer Raye Linux" {
    linux   /casper/vmlinuz boot=casper noprompt locale=fr_CA.UTF-8 keyboard-layouts=ca quiet splash ---
    initrd  /casper/initrd
}
menuentry "Safe graphics" {
    linux   /casper/vmlinuz boot=casper noprompt nomodeset quiet splash ---
    initrd  /casper/initrd
}
menuentry "Check the USB stick for errors" {
    linux   /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd  /casper/initrd
}
fi
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI firmware settings" {
    fwsetup
}
fi
