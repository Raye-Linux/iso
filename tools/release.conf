# What and where the publish tools publish. KEY=VALUE, no shell. The
# values for one machine go in release.local.conf next to this file (ignored
# by git, same format); an environment variable of the same name wins over
# both.

RELEASE=1.0-beta
RELEASE_TITLE=Raye Linux 1.0 Beta 2

SUITE=resolute
COMPONENT=main
ARCHES=amd64

# signing subkey of the archive key, and the keyring that holds it
SIGNING_KEY=E00515536D1382C4ABB31485A5B09A59F05E0DA0
GNUPGHOME=/var/lib/raye-release/gnupg

# what the image build leaves behind
DEBS=/var/tmp/raye/iso-build/var/tmp/raye-build/debs
ISO=/var/tmp/raye/isos/latest.iso

# The apt tree and the release files are staged here. It has to be under
# /srv, the only place the GitHub machine sees, and outside /srv/raye, which
# the image build copies. apt/ in it is the published state: publish-repo
# compares new packages with it.
STAGE=/srv/publish

R2_ENV=/var/lib/raye-release/r2.env
R2_PUBLIC=https://dl.rayelinux.com

GITHUB_ORG=Raye-Linux
GITHUB_PACKAGES=packages
GITHUB_RELEASES=releases
GITHUB_PAGES=https://raye-linux.github.io/packages
# the machine that holds the GitHub login: its VM id on the hypervisor,
# reached with ssh to GITHUB_HOST and the guest agent there
GITHUB_VM=0
GITHUB_HOST=hypervisor
