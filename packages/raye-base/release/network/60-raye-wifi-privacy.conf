# Private Wi-Fi address: each Wi-Fi network sees its own address for this
# PC, the same every time it comes back, so a router keeps its reservation
# and a hotel keeps the sign-in. Settings turns it off per network.
# Scans already use a random address (NetworkManager's default).
[connection-raye-wifi-privacy]
match-device=type:wifi
wifi.cloned-mac-address=stable
