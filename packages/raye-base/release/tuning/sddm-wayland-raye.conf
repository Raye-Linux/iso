# The sign-in screen's KWin, started through raye-amd-cursor: on an AMD
# card and a kernel without the RGBA8888 fix it draws the pointer itself,
# or the screen can stay black. raye-amd-cursor-guard ships with this
# file and starts KWin plainly if raye-amd-cursor (raye-system) is not
# there, so a sign-in screen always comes up. Read after sddm-raye.conf
# (the last file wins), so the command is the same one with the wrapper
# in front.
# KWIN_FORCE_SW_CURSOR=0 in GreeterEnvironment turns it off.
[Wayland]
CompositorCommand=/usr/libexec/raye-amd-cursor-guard kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
