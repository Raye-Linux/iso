; Raye Linux: GameMode while a game runs. The processor runs at full speed
; (the "performance" governor, GameMode's default, written out here) and the
; game scheduler takes over; both go back to what they were when the game
; ends. Nothing is reniced, and the screen does not lock during a game.
[general]
desiredgov=performance
renice=0
softrealtime=off
ioprio=0
inhibit_screensaver=1

[custom]
start=systemctl --no-ask-password start raye-game-scheduler.service
end=systemctl --no-ask-password stop raye-game-scheduler.service
script_timeout=10
